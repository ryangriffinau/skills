id: local.convex_prod_credential_read_guard
name: Convex Production Credential-Table Read Guard
version: 1.0.0
description: >
  Closes the read hole demonstrated on 2026-08-10 (customer-kingfield-ixg4):
  a prod-targeted raw read of graph_credential_materials returned the
  delegated-send Graph client secret and refresh token in cleartext into an
  agent transcript.

  This is DELIBERATELY NARROW. local.convex_prod_deploy_guard states an explicit
  Ryan-ruled read policy: agents must be able to investigate production freely,
  so targeted table reads, logs, env get/list and function-spec are all free
  against prod. That policy is correct for every table except the one that
  stores cleartext credential material. So this pack gates reads BY TABLE NAME
  rather than gating the verb, and leaves the read policy intact everywhere
  else.

  graph_credential_materials is the only table in the schema carrying
  clientSecret, accessToken and refreshToken (verified against
  packages/backend/convex/graph/table.ts). Every other "token" field in the
  schema is a lease or fencing token used for concurrency, or an LLM token
  count - none are secrets.

  Confirm-tier, not hard-block: there are legitimate reasons to inspect the row
  shape (expiry metadata, fingerprint, lastVerifiedAt). The sanctioned path is a
  redacted operator read that prints metadata without secret values.
keywords:
  - convex
  - graph_credential_materials
destructive_patterns:
  - name: prod-credential-table-read
    description: prod-targeted read of a cleartext credential table (data/export/import)
    pattern: '(?:(?:CONVEX_PRODUCTION_DEPLOY_KEY|CONVEX_DEPLOY_KEY=["'']?prod:|CONVEX_DEPLOYMENT=["'']?prod:)[^|;&]*convex\s+(?:data|export|import)\b[^|;&]*graph_credential_materials\b|convex\s+(?:data|export|import)\b[^|;&]*graph_credential_materials\b[^|;&]*(?:--prod(?:\s|$|[|;&])|--deployment(?:=|\s+)["'']?(?:[\w.-]+:){0,2}prod["'']?(?:\s|$|[|;&]))|convex\s+(?:data|export|import)\b[^|;&]*(?:--prod(?:\s|$|[|;&])|--deployment(?:=|\s+)["'']?(?:[\w.-]+:){0,2}prod["'']?(?:\s|$|[|;&]))[^|;&]*graph_credential_materials\b)'
    explanation: >
      graph_credential_materials stores clientSecret, accessToken and
      refreshToken in cleartext. A prod-targeted raw read of it prints those
      values straight into the agent transcript, which is a credential
      disclosure requiring rotation - exactly what happened on 2026-08-10.
      Matches the table name and the prod selector in either order, and covers
      data, export and import because all three can surface row contents.
    denial_trailer: >-
      Confirm required: reading graph_credential_materials against PRODUCTION
      prints the Graph client secret and refresh token in cleartext into this
      transcript and forces a credential rotation (customer-kingfield-ixg4,
      2026-08-10). Use the redacted operator read (fingerprint, expiry,
      lastVerifiedAt only). Need the raw row? Approve once with
      `dcg allow-once <code>` and tell Ryan to rotate afterwards.
safe_patterns: []
